name: Unturned Images Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (SemVer: https://semver.org)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout Repository

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Restore
        run: dotnet restore

      - name: Update versions
        run: |
          release_version="${{ github.event.inputs.version }}"

          sed -i "s#<Version>0.0.0</Version>#<Version>$release_version</Version>#" UnturnedImages.OpenMod/UnturnedImages.csproj
          sed -i "s#<Version>0.0.0</Version>#<Version>$release_version</Version>#" UnturnedImages.RocketMod/UnturnedImages.RocketMod.csproj
          sed -i "s#<Version>0.0.0</Version>#<Version>$release_version</Version>#" tools/UnturnedImages.Module/UnturnedImages.Module.csproj
          sed -i "s#<Version>0.0.0</Version>#<Version>$release_version</Version>#" tools/UnturnedImages.Module.Bootstrapper/UnturnedImages.Module.Bootstrapper.csproj
          sed -i "s#\"Version\": \"0.0.0\"#\"Version\": \"$release_version\"#" tools/UnturnedImages.Module/UnturnedImages.module

      - name: Build OpenMod plugin
        run: dotnet build UnturnedImages.OpenMod/UnturnedImages.csproj --configuration Release --no-restore

      - name: Build RocketMod plugin
        run: dotnet build UnturnedImages.RocketMod/UnturnedImages.RocketMod.csproj --configuration Release --no-restore

      - name: Build module
        run: dotnet build tools/UnturnedImages.Module/UnturnedImages.Module.csproj --configuration Release --no-restore

      - name: Push OpenMod to NuGet
        run: |
          dotnet nuget push UnturnedImages.OpenMod/bin/Release/*.nupkg \
            --api-key ${{ secrets.NUGET_DEPLOY_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push RocketMod to NuGet
        run: |
          dotnet nuget push UnturnedImages.RocketMod/bin/Release/*.nupkg \
            --api-key ${{ secrets.NUGET_DEPLOY_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push OpenMod to GitHub Packages
        run: |
          dotnet nuget push UnturnedImages.OpenMod/bin/Release/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/F-Plugins/index.json \
            --skip-duplicate

      - name: Push RocketMod to GitHub Packages
        run: |
          dotnet nuget push UnturnedImages.RocketMod/bin/Release/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/F-Plugins/index.json \
            --skip-duplicate

      - name: Stage release files
        run: |
          mkdir -p release/OpenMod release/RocketMod release/Module

          cp UnturnedImages.OpenMod/bin/Release/netstandard2.1/UnturnedImages.dll release/OpenMod/
          cp UnturnedImages.OpenMod/config.yaml release/OpenMod/config.yaml
          cp UnturnedImages.OpenMod/bin/Release/*.nupkg release/OpenMod/

          cp UnturnedImages.RocketMod/bin/Release/net48/UnturnedImages.RocketMod.dll release/RocketMod/
          cp UnturnedImages.RocketMod/README.md release/RocketMod/README.md
          cp UnturnedImages.RocketMod/bin/Release/*.nupkg release/RocketMod/

          cp tools/UnturnedImages.Module/bin/Release/net48/*.dll release/Module/
          cp tools/UnturnedImages.Module/bin/Release/net48/*.module release/Module/

      - name: Zip release files
        run: |
          cd release/OpenMod && zip -qr ../../UnturnedImages.OpenMod.zip . && cd ../..
          cd release/RocketMod && zip -qr ../../UnturnedImages.RocketMod.zip . && cd ../..
          cd release/Module && zip -qr ../../UnturnedImages.Module.zip . && cd ../..
          cd release && zip -qr ../UnturnedImages.All.zip OpenMod RocketMod Module && cd ..

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "UnturnedImages v${{ github.event.inputs.version }}"
          draft: true
          prerelease: false
          files: |
            UnturnedImages.OpenMod.zip
            UnturnedImages.RocketMod.zip
            UnturnedImages.Module.zip
            UnturnedImages.All.zip
            UnturnedImages.OpenMod/bin/Release/*.nupkg
            UnturnedImages.RocketMod/bin/Release/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
